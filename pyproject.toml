[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sinan-mcp"
version = "0.4.0a6"
description = "Experimental SINAN MCP toolkit for official-source discovery and synthetic epidemiology research workflows"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
ingest = ["pysus>=2.11.7,<3", "pandas>=2,<3", "pyarrow>=17,<25"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mcp[cli]==2.3.0"]

[project.scripts]
sinan-mcp = "sinan_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["sinan_mcp*"]

[tool.setuptools.package-data]
sinan_mcp = ["public_privacy.html", "public_about.html", "public_support.html", "public_terms.html", "documentary_registry.json", "public_instruments_2024.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
