name: Public synthetic runtime security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '18 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned audit and lock generation tools
        run: python -m pip install "pip-tools==7.6.2" "pip-audit==2.10.1"
      - name: Resolve pinned public dependencies with hashes
        run: python -m piptools compile --generate-hashes --no-header --no-annotate --output-file=requirements-public.lock pyproject.toml
      - name: Emit lock to allow initial versioned review
        run: |
          echo PUBLIC_LOCK_BEGIN
          cat requirements-public.lock
          echo PUBLIC_LOCK_END
      - name: Verify package integrity and dependency compatibility
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-public.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Reject known vulnerable runtime packages
        run: python -m pip_audit -r requirements-public.lock --strict
