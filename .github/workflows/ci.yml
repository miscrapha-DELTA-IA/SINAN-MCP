name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Block tracked private datasets and credentials
        run: python scripts/check_sensitive_repo.py
      - name: Verify public MCP import isolation
        run: python scripts/check_public_isolation.py
      - name: Freeze synthetic-only public deployment manifest
        run: python scripts/check_public_deployment.py
      - run: python -m pytest -q
      - run: python -m sinan_mcp demo
