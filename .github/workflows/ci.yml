name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Verify versioned synthetic public contract and deployment guard
        run: python scripts/check_public_contract.py
      - name: Exercise MCP client and local synthetic CLI E2E
        run: python -m pytest -q tests/test_mcp_end_to_end_contract.py
      - name: Full offline test suite
        run: python -m pytest -q
      - run: python -m sinan_mcp demo
