name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Verify versioned synthetic public contract and deployment guard
        run: python scripts/check_public_contract.py
      - name: Exercise MCP client and local synthetic CLI E2E
        run: python -m pytest -q tests/test_mcp_end_to_end_contract.py
      - name: Full offline test suite
        run: python -m pytest -q
      - run: python -m sinan_mcp demo
