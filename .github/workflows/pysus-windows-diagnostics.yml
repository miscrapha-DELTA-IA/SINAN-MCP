name: PySUS Windows catalog diagnostic
on:
  workflow_dispatch:
  push:
    branches:
      - fix/diagnose-pysus-windows-cache
      - feat/secure-windows-pysus-import
      - feat/secure-chatgpt-fairness-audit
permissions:
  contents: read
jobs:
  catalog-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYSUS_CACHEPATH: ${{ github.workspace }}/data/sinan-pysus-catalog-investigation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install optional PySUS and test dependencies
        run: python -m pip install -e ".[dev,ingest]"
      - name: Offline adapter unit tests
        run: python -m pytest -q tests/test_ingest_pysus.py tests/test_catalog_import.py tests/test_privacy_fairness.py
      - name: Discover TUBE 2024 in isolated cache and inspect HTTPS
        run: python -m sinan_mcp descobrir-pysus --agravo TUBE --ano 2024 --diagnostico
      - name: Discover DENG 2024 in isolated cache and inspect HTTPS
        run: python -m sinan_mcp descobrir-pysus --agravo DENG --ano 2024 --diagnostico
      # No patient-level downloads, no credentials and no uploaded data artifacts.
      - name: Preview import TUBE 2024 (metadata only)
        run: python -m sinan_mcp planejar-pysus --agravo TUBE --ano 2024
      - name: Preview import DENG 2024 (metadata only)
        run: python -m sinan_mcp planejar-pysus --agravo DENG --ano 2024
      - name: Compare direct DuckDB file index against PySUS discovery
        run: python scripts/probe_pysus_catalog.py
