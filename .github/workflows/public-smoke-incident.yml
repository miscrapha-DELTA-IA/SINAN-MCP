name: Record public MCP smoke failure incident
on:
  workflow_run:
    workflows: ["Public HTTPS MCP smoke"]
    types: [completed]

# Separate from the read-only probe. Do not run untrusted failed-run code
# or use Render keys. Only issue write permissions on this independent job.
permissions: {}
concurrency:
  group: public-mcp-smoke-incident
  cancel-in-progress: false

jobs:
  record-incident:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout protected main, never code from the failed run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Create or update sanitized failure incident
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/report_public_smoke_failure.py
