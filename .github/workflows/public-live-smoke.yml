name: Public HTTPS MCP smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-live-smoke.yml
      - scripts/probe_public_https.py
permissions:
  contents: read
jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Probe Render health and 10 contracted MCP tools, no real records
        env:
          SINAN_PUBLIC_SMOKE_URL: https://sinan-mcp-public-preview.onrender.com
        run: python scripts/probe_public_https.py
