name: Public HTTPS MCP smoke
on:
  workflow_dispatch:
  # Two lightweight, read-only checks daily: 06:17 and 18:17 Fortaleza (UTC-3).
  # GitHub scheduling is best effort; missed/delayed runs are not proof of uptime.
  schedule:
    - cron: '17 9,21 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/public-live-smoke.yml
      - scripts/probe_public_https.py
# No overlapping scheduled/manual checks and no access to write repository content.
concurrency:
  group: public-live-smoke-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Probe Render health and 10 contracted MCP tools, no real records
        env:
          SINAN_PUBLIC_SMOKE_URL: https://sinan-mcp-public-preview.onrender.com
        run: python scripts/probe_public_https.py
