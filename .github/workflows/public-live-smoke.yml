name: Public HTTPS MCP smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-live-smoke.yml
      - scripts/probe_public_https.py
permissions:
  contents: read
jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Probe Render health and 10 contracted MCP tools, no real records
        env:
          SINAN_PUBLIC_SMOKE_URL: https://sinan-mcp-public-preview.onrender.com
        run: python scripts/probe_public_https.py
