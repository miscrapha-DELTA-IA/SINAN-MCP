name: Public HTTPS MCP smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-live-smoke.yml
      - scripts/probe_public_https.py
permissions:
  contents: read
jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Probe Render health and 10 contracted MCP tools, no real records
        env:
          SINAN_PUBLIC_SMOKE_URL: https://sinan-mcp-public-preview.onrender.com
        run: python scripts/probe_public_https.py
