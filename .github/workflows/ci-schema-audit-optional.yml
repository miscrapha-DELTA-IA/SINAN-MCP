name: Optional local dictionary schema audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-schema-review:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only the local JSON streaming extra and test dependencies
        run: python -m pip install -e ".[dev,schemaaudit]"
      - name: Verify streaming backend is installed
        run: python -c "import ijson; print('ijson available')"
      - name: Protect repository from accidentally committed clinical files
        run: python scripts/check_sensitive_repo.py
      - name: Exercise synthetic CSV/JSON schema comparison and MCP isolation
        run: python -m pytest -q tests/test_local_schema_review.py tests/test_official_annual_resources.py tests/test_public_mcp_contract.py tests/test_public_server.py
      # No external datasets, PDF download, persisted review report or CI artifacts.
