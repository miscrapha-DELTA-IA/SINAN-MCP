name: PySUS optional integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optional-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,ingest]'
      - run: python -m pytest -q tests/test_ingest_pysus.py
      - run: python -c "import pysus, pyarrow; print('PySUS/PyArrow dependencies imported')"
      # No real records are downloaded or uploaded to CI artifacts.
