name: PySUS optional integration
on:
  workflow_dispatch:
  push:
    branches: [fix/pysus-windows-empty-catalog]
permissions:
  contents: read
jobs:
  optional-ingest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,ingest]'
      - run: python -m pytest -q tests/test_ingest_pysus.py tests/test_local_parquet.py
      - run: python -c "import pysus, pyarrow; assert callable(pysus.ftp.sinan); print('PySUS/PyArrow API loaded')"
      - name: Inspect PySUS catalog and source diagnostics (no downloads)
        run: python -m sinan_mcp diagnosticar-pysus --agravo TUBE --ano 2024
      - name: Test discovery with a separate empty cache (Windows isolated)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python -m sinan_mcp descobrir-pysus --agravo TUBE --ano 2024 --source catalog --cache-dir ./data/ci-pysus-fresh
      - name: Discover public SINAN TUBE 2024 file names (no microdata download)
        continue-on-error: ${{ runner.os == 'Windows' }} # upstream 2.11.7 returns empty on Windows
        timeout-minutes: 3
        run: python -m sinan_mcp descobrir-pysus --agravo TUBE --ano 2024 --source catalog
      - name: Discover public SINAN DENG 2024 file names (no microdata download)
        continue-on-error: ${{ runner.os == 'Windows' }} # log remains visible; NOT proof of Windows support
        timeout-minutes: 3
        run: python -m sinan_mcp descobrir-pysus --agravo DENG --ano 2024 --source catalog
      # No real records are downloaded or uploaded to CI artifacts.
