name: Optional PDF dictionary candidate extraction
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-pdf-audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and OPTIONAL local PDF codebook inspection packages
        run: python -m pip install -e ".[dev,pdfaudit,schemaaudit]" reportlab
      - name: Make optional backend requirements explicit
        run: python -c "import pymupdf, reportlab, ijson; print('PDF and JSON tooling present')"
      - name: Prevent accidental sensitive repository content
        run: python scripts/check_sensitive_repo.py
      - name: Synthetic PDF/CSV/JSON tests only
        run: python -m pytest -q tests/test_local_pdf_dictionary_candidate.py tests/test_local_dengue_dictionary_crosswalk.py tests/test_local_dengue_csv_extra_review.py tests/test_local_schema_review.py tests/test_public_mcp_contract.py
      # NO download of government PDFs or patient datasets; never upload
      # review results as CI artifacts or publish codebook candidates.
